name: publish-lab-02

on:
  push:
    paths:
      - "lab-02/**"
      - ".github/workflows/publish-lab-02.yml"
  pull_request:
    paths:
      - "lab-02/**"
      - ".github/workflows/publish-lab-02.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('lab-02/requirements.txt', 'lab-02/requirements-dev.txt') }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    #permissions:
      #contents: write    
      #packages: write    
    outputs:
      reference: ${{ steps.ref.outputs.reference }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/catshop-lab-02" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Reference by digest
        id: ref
        run: |
          REF="${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
          echo "reference=$REF" >> "$GITHUB_OUTPUT"
          echo "published: $REF"
          echo "published: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Write lab-02/published.txt
        run: |
          printf '%s\n' "${{ steps.ref.outputs.reference }}" > lab-02/published.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab-02/published.txt
          git diff --cached --quiet || git commit -m "ci: record published digest [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
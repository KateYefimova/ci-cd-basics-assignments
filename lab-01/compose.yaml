services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-catshop}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-catshop}
      PARTNER_URL: http://partner:8080
    depends_on:
      db:
        condition: service_healthy
      partner:
        condition: service_started
    networks:
      - default
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-catshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-catshop}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

  partner:
    image: wiremock/wiremock:3.6.0
    volumes:
      - ./partner/mappings:/home/wiremock/mappings:ro
    networks:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

networks:
  default:
  backend:
    internal: true   